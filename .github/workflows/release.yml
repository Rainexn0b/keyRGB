name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  appimage:
    name: Build + Upload AppImage
    # Keep the bundled native runtime compatible with Ubuntu 22.04 (glibc 2.35).
    # Do not float this to ubuntu-latest: the catalog tests on this baseline.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        # Pin major tag v7 to immutable commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # Pin major tag v7 to immutable commit SHA.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Pillow 13 requires 3.11; build matching GI bindings below, not Jammy's cp310 package.
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            shellcheck \
            binutils \
            build-essential \
            file \
            squashfs-tools \
            zsync \
            pkg-config \
            libcairo2-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libayatana-appindicator3-1 \
            libayatana-indicator3-7 \
            libayatana-ido3-0.4-0 \
            libdbusmenu-gtk3-4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Jammy's GI runtime is supported by this binding release. Compile both
          # extensions with the exact Python ABI bundled into the AppImage.
          python -m pip install --no-binary=pycairo,PyGObject pycairo==1.25.1 PyGObject==3.50.2
          python -m pip install -e ".[dev]"

      - name: Dependency audit (pip-audit)
        run: python scripts/dependency_audit.py --project-dir .

      - name: Build AppImage (release profile)
        run: |
          python -m buildpython --profile=release

      - name: Verify AppImage and zsync output
        run: |
          ls -la dist || true
          test -s dist/keyrgb-x86_64.AppImage
          test -s dist/keyrgb-x86_64.AppImage.zsync

      - name: Upload release build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyrgb-release-buildlog
          path: buildlog/keyrgb/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate SHA-256 sidecar
        working-directory: dist
        run: |
          sha256sum keyrgb-x86_64.AppImage > keyrgb-x86_64.AppImage.sha256
          echo "Checksum:"
          cat keyrgb-x86_64.AppImage.sha256

      - name: Upload AppImage to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/keyrgb-x86_64.AppImage \
            dist/keyrgb-x86_64.AppImage.zsync \
            dist/keyrgb-x86_64.AppImage.sha256 \
            --generate-notes

      - name: Upload validated build-only artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyrgb-validated-appimage
          path: |
            dist/keyrgb-x86_64.AppImage
            dist/keyrgb-x86_64.AppImage.zsync
            dist/keyrgb-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 7
