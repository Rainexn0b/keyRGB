name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    name: Build + Upload AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pin major tag v5 to immutable commit SHA.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        # Pin major tag v6 to immutable commit SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            shellcheck \
            squashfs-tools \
            python3-gi \
            gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libayatana-appindicator3-1 \
            libayatana-indicator3-7 \
            libayatana-ido3-0.4-0 \
            libdbusmenu-gtk3-4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Build AppImage (release profile)
        run: |
          python -m buildpython --profile=release

      - name: Verify AppImage output
        run: |
          ls -la dist || true
          test -f dist/keyrgb-x86_64.AppImage

      - name: Generate SHA-256 sidecar
        working-directory: dist
        run: |
          sha256sum keyrgb-x86_64.AppImage > keyrgb-x86_64.AppImage.sha256
          echo "Checksum:"
          cat keyrgb-x86_64.AppImage.sha256

      - name: Upload AppImage to GitHub Release
        # Pin major tag v2 to immutable commit SHA.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
