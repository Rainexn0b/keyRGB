name: Hardware support / diagnostics
description: Report a new laptop/keyboard so KeyRGB can add support or quirks.
title: "Hardware support: <brand/model> (<USB ID if known>)"
labels: ["hardware", "support"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve KeyRGB hardware support.

        In KeyRGB, open **Settings → Version → Support Tools…**, run **Run diagnostics** and **Scan devices**, then choose **Save full support bundle…**. Drag the saved `keyrgb-support-bundle.json` into the evidence field below.

        If the UI cannot be opened, paste the output of `keyrgb-diagnostics` or `keyrgb --diagnostics` instead. These fallback commands are read-only.

  - type: textarea
    id: what_happened
    attributes:
      label: What works / what doesn't
      description: Tell us what you tried (tray, uniform UI, per-key UI) and what happened.
      placeholder: |
        - Distro/DE:
        - Tray starts:
        - Uniform color works:
        - Brightness works:
        - Per-key works:
        - Any flicker / fighting with other tools:
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Support bundle or fallback diagnostics
      description: Attach the `keyrgb-support-bundle.json` saved by Support Tools. If the UI was unavailable, paste the full `keyrgb-diagnostics` or `keyrgb --diagnostics` JSON instead.
      placeholder: Drag the support bundle here, or paste fallback diagnostics JSON.
    validations:
      required: true

  - type: textarea
    id: debug_logs
    attributes:
      label: Diagnostic-session logs
      description: Only for a reproducible runtime failure, run `keyrgb --diagnostic-session`, reproduce the problem, then attach `keyrgb-debug.log` and relevant `journal-*.log` files from the printed session directory. Review logs for personal data first.
      render: text
    validations:
      required: false

  - type: textarea
    id: lsusb
    attributes:
      label: USB IDs (optional)
      description: Paste `lsusb | grep -i 048d` (or full `lsusb` if nothing matches).
      render: text
    validations:
      required: false

  - type: textarea
    id: additional_evidence
    attributes:
      label: Additional evidence (optional)
      description: Paste any extra capture results such as `lsusb -v -d <vid:pid>` or `usbhid-dump -e descriptor`.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: Support outputs are sanitized best-effort but may still contain host-identifying strings, paths, serials, or journal details. Review files before posting. You may redact DMI strings while keeping the surrounding structure.
      options:
        - label: I confirm this report contains no secrets.
          required: true
